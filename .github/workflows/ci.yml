name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The JSONTestSuite download task shells out to `gh api`; GitHub runners ship gh but need a token.
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - name: Cache JSONTestSuite corpus
        uses: actions/cache@v4
        with:
          path: jolt-test/build/jsontestsuite.zip
          key: jsontestsuite-1ef36fa01286573e846ac449e8683f8833c5b26a
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (includes full JSONTestSuite gate)
        run: ./gradlew build
